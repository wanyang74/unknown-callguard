# Fly.io config. Set `app` to the name you pick in `fly launch`, or leave this
# placeholder and deploy with `fly deploy -a <your-app>`.
app = "callguard-CHANGE-ME"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay running: a cold start would leave callers in silence.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "callguard_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
